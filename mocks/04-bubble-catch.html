<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>バブル・キャッチ</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 04 バブル・キャッチ
// 長押しでしゃぼん玉がふくらみ、ふれたキャラを中に閉じ込める。離すと空へ昇ってパチン→得点。
// 同じキャラが多いほど高得点（個数の2乗）。ただしトゲトゲにふれた瞬間に割れる。欲張るかどうかのチキンレース。
const { c, ctx } = setupCanvas();
const TYPES = MASCOTS.slice(0, 4);
let floaters, spikes, bubble, rising, score, lives, timeLeft, over, clouds, time;
clouds = [...Array(6)].map(() => ({ x: rand(0, W), y: rand(80, 600), s: rand(0.6, 1.4), v: rand(4, 12) }));

function newFloater(edge) {
  const f = { x: rand(30, W - 30), y: rand(120, 560), t: randi(4), ph: rand(0, 7), vx: rand(-18, 18), vy: rand(-12, 12), s: 0 };
  if (edge) { f.y = H + 20; f.vy = -rand(30, 50); }
  return f;
}
function reset() {
  floaters = [...Array(26)].map(() => newFloater(false));
  spikes = [...Array(3)].map(() => ({ x: rand(40, W - 40), y: rand(160, 520), vx: rand(-35, 35), vy: rand(-35, 35), rot: 0 }));
  bubble = null; rising = []; score = 0; lives = 3; timeLeft = 60; over = false; time = 0;
}
reset();

c.addEventListener('pointerdown', e => {
  if (over) { reset(); return; }
  const p = toLocal(c, e);
  bubble = { x: p.x, y: p.y, r: 8, caught: [], wob: 0 };
  tone(520, 0.1, 'sine', 0.06);
});
c.addEventListener('pointermove', e => { if (bubble) { const p = toLocal(c, e); bubble.x += (p.x - bubble.x) * 0.3; bubble.y += (p.y - bubble.y) * 0.3; } });
c.addEventListener('pointerup', () => {
  if (!bubble) return;
  if (bubble.caught.length) { bubble.vy = -140; rising.push(bubble); tone(700, 0.2, 'sine', 0.08); }
  else burstBubble(bubble, false);
  bubble = null;
});

function burstBubble(b, fail) {
  burst(b.x, b.y, '#bfefff', 20, 200, 0);
  for (const f of b.caught) { f.x = b.x + f.ox; f.y = b.y + f.oy; f.vx = rand(-60, 60); f.vy = rand(-60, 60); floaters.push(f); }
  if (fail) { lives--; shake(10); flash(0.5, '255,80,110'); popText(b.x, b.y, 'パチン!', '#ff5c8a', 26); tone(120, 0.35, 'sawtooth', 0.08); if (lives <= 0) over = true; }
}

function scoreBubble(b) {
  const cnt = {}; b.caught.forEach(f => cnt[f.t] = (cnt[f.t] || 0) + 1);
  let pts = Object.values(cnt).reduce((s, n) => s + n * n * 10, 0);
  const kinds = Object.keys(cnt).length, n = b.caught.length;
  if (kinds === 1 && n >= 3) { pts *= 3; banner('ぜんぶ ' + TYPES[b.caught[0].t].name + '!', TYPES[b.caught[0].t].c, 40, n + '体 ×3 → +' + pts); flash(0.5); }
  else if (n >= 8) banner('大漁!', '#7ff5ff', 52, n + '体 +' + pts);
  score += pts;
  popText(b.x, b.y + 30, '+' + pts, '#ffe14d', 22);
  burst(b.x, b.y, '#ffffff', 30, 260, 0);
  b.caught.forEach((f, i) => { burst(b.x + f.ox, b.y + f.oy, TYPES[f.t].c, 6, 150, 200); tone(noteHz(f.t * 2 + i % 4), 0.25, 'triangle', 0.05, i * 0.04); });
  for (let i = 0; i < n; i++) floaters.push(newFloater(true));
}

function update(dt) {
  if (over) return;
  time += dt; timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; over = true; }
  for (const cl of clouds) { cl.x += cl.v * dt; if (cl.x > W + 60) cl.x = -60; }
  for (const f of floaters) {
    f.ph += dt; f.x += (f.vx + Math.sin(f.ph * 1.3) * 12) * dt; f.y += (f.vy + Math.cos(f.ph) * 10) * dt;
    if (f.x < 20 || f.x > W - 20) f.vx *= -1;
    if (f.y > 580) f.vy = -Math.abs(f.vy) - 5;
    if (f.y < 110) f.vy = Math.abs(f.vy);
    f.x = clamp(f.x, 20, W - 20);
    if (f.s < 1) f.s = Math.min(1, f.s + dt * 3);
  }
  for (const s of spikes) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt;
    if (s.x < 30 || s.x > W - 30) s.vx *= -1;
    if (s.y < 130 || s.y > 560) s.vy *= -1;
  }
  if (bubble) {
    bubble.r = Math.min(120, bubble.r + dt * 48); bubble.wob += dt;
    floaters = floaters.filter(f => {
      if (Math.hypot(f.x - bubble.x, f.y - bubble.y) < bubble.r) {
        f.ox = f.x - bubble.x; f.oy = f.y - bubble.y; bubble.caught.push(f);
        tone(noteHz(4 + bubble.caught.length), 0.12, 'sine', 0.05); return false;
      }
      return true;
    });
    for (const f of bubble.caught) { const d = Math.hypot(f.ox, f.oy), m = bubble.r - 14; if (d > m) { f.ox *= m / d; f.oy *= m / d; } }
    if (spikes.some(s => Math.hypot(s.x - bubble.x, s.y - bubble.y) < bubble.r + 12)) { burstBubble(bubble, true); bubble = null; }
  }
  for (const b of rising) {
    b.y += b.vy * dt; b.vy -= 60 * dt; b.wob += dt;
    if (b.y + b.r < 100) { scoreBubble(b); b.done = true; }
  }
  rising = rising.filter(b => !b.done);
}

function drawBubble(b) {
  const w = Math.sin(b.wob * 6) * 0.03;
  for (const f of b.caught) drawMascot(ctx, b.x + f.ox, b.y + f.oy, 12, TYPES[f.t], { expr: 'wow', seed: f.ph });
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1 + w, 1 - w);
  const g = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, b.r * 0.1, 0, 0, b.r);
  g.addColorStop(0, 'rgba(255,255,255,0.05)'); g.addColorStop(0.8, 'rgba(180,230,255,0.15)'); g.addColorStop(1, 'rgba(255,190,240,0.5)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(-b.r * 0.45, -b.r * 0.5, b.r * 0.15, b.r * 0.07, -0.7, 0, 7); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save(); applyShake(ctx);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8fd3ff'); g.addColorStop(0.7, '#ffd6ec'); g.addColorStop(1, '#fff1c9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (const cl of clouds) { for (const [dx, dy, r] of [[0, 0, 22], [20, -8, 18], [38, 0, 20], [18, 6, 20]]) { ctx.beginPath(); ctx.arc(cl.x + dx * cl.s, cl.y + dy * cl.s, r * cl.s, 0, 7); ctx.fill(); } }
  for (const f of floaters) drawMascot(ctx, f.x, f.y, 13, TYPES[f.t], { scale: f.s, seed: f.ph, look: Math.sin(f.ph) });
  for (const s of spikes) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = '#3d2c55'; ctx.beginPath(); star(ctx, 0, 0, 16, 9, 9); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x - 3, s.y - 1, 2.2, 0, 7); ctx.arc(s.x + 3, s.y - 1, 2.2, 0, 7); ctx.fill();
  }
  for (const b of rising) drawBubble(b);
  if (bubble) {
    drawBubble(bubble);
    const n = bubble.caught.length;
    if (n) outlineText(ctx, n + '体', bubble.x, bubble.y - bubble.r - 14, 16, '#fff', 4);
  }
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'バブル・キャッチ', score, '♥'.repeat(lives) + '  ' + Math.ceil(timeLeft) + 's', '#fff');
  outlineText(ctx, '長押しでふくらむ → 離すと空へ。トゲトゲに注意！', W / 2, 616, 12, '#fff', 3);
  if (over) endPanel(ctx, lives <= 0 ? 'ぜんぶ割れた…' : 'TIME UP', score);
}
loop(update, draw);
</script></body></html>
