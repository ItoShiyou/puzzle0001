<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>くるりんボード</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 04: 盤面ごと90°回転→重力でキャラが落ちる→同じキャラ4つ以上つながると消える。1手ごとに新キャラが降ってくる
const { c, ctx } = setupCanvas();
const N = 7, CS = 44, CX = W / 2, CY = 350, TYPES = CHARS.slice(0, 4);
let g, score, angle, phase, chain, turns, over, clearing, clearT, maxChain;

const bx = col => CX + (col - (N - 1) / 2) * CS, by = row => CY + (row - (N - 1) / 2) * CS;

function reset() {
  g = [...Array(N)].map(() => Array(N).fill(null));
  for (let i = 0; i < 24; i++) { dropNew(); gravity(); } for (const r of g) for (const p of r) if (p) p.oy = 0;
  // 初期盤面で消える組をなくす
  let grp; while ((grp = groups()).length) grp.flat().forEach(([r, cc]) => g[r][cc].t = randi(4));
  score = 0; angle = 0; phase = 'idle'; chain = 0; turns = 0; over = false; clearing = []; maxChain = 0;
}

function dropNew() {
  const cols = [...Array(N).keys()].filter(cc => !g[0][cc]);
  if (!cols.length) return false;
  const cc = cols[randi(cols.length)];
  g[0][cc] = { t: randi(4), oy: -CS * 3 };
  return true;
}

function gravity() {
  let moved = false;
  for (let cc = 0; cc < N; cc++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const p = g[r][cc]; if (!p) continue;
      if (w !== r) { p.oy += (r - w) * CS; g[w][cc] = p; g[r][cc] = null; moved = true; }
      w--;
    }
  }
  return moved;
}

function groups() {
  const seen = g.map(r => r.map(() => false)), out = [];
  for (let r = 0; r < N; r++) for (let cc = 0; cc < N; cc++) {
    if (!g[r][cc] || seen[r][cc]) continue;
    const t = g[r][cc].t, st = [[r, cc]], grp = []; seen[r][cc] = true;
    while (st.length) {
      const [y, x] = st.pop(); grp.push([y, x]);
      for (const [dy, dx] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const ny = y + dy, nx = x + dx;
        if (ny < 0 || ny >= N || nx < 0 || nx >= N || seen[ny][nx] || !g[ny][nx] || g[ny][nx].t !== t) continue;
        seen[ny][nx] = true; st.push([ny, nx]);
      }
    }
    if (grp.length >= 4) out.push(grp);
  }
  return out;
}

function rotate(dir) { // dir=1:時計回り, -1:反時計回り
  if (phase !== 'idle' || over) return;
  const ng = [...Array(N)].map(() => Array(N).fill(null));
  for (let r = 0; r < N; r++) for (let cc = 0; cc < N; cc++) {
    if (dir === 1) ng[cc][N - 1 - r] = g[r][cc]; else ng[N - 1 - cc][r] = g[r][cc];
  }
  g = ng; for (const r of g) for (const p of r) if (p) p.oy = 0;
  angle = -dir * Math.PI / 2; phase = 'spin'; chain = 0; turns++;
}

reset();
let sx = null;
c.addEventListener('pointerdown', e => {
  if (over) { reset(); return; }
  const p = toLocal(c, e); sx = p.x;
  if (p.y > 560) rotate(p.x < W / 2 ? -1 : 1), sx = null;
});
c.addEventListener('pointerup', e => {
  if (sx == null) return;
  const dx = toLocal(c, e).x - sx; sx = null;
  if (Math.abs(dx) > 30) rotate(dx > 0 ? 1 : -1);
});
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') rotate(-1); if (e.key === 'ArrowRight') rotate(1); });

function falling() { return g.some(r => r.some(p => p && p.oy)); }

function update(dt) {
  if (over) return;
  for (const r of g) for (const p of r) if (p && p.oy) p.oy = p.oy > 0 ? Math.max(0, p.oy - 700 * dt) : Math.min(0, p.oy + 700 * dt);
  if (phase === 'spin') {
    const sp = dt * 9;
    angle = Math.abs(angle) <= sp ? 0 : angle - Math.sign(angle) * sp;
    if (angle === 0) { angle = 0; gravity(); phase = 'fall'; }
    return;
  }
  if (phase === 'fall' && !falling()) {
    const gs = groups();
    if (gs.length) {
      chain++; maxChain = Math.max(maxChain, chain);
      clearing = gs.flat(); clearT = 0; phase = 'clear';
      const n = clearing.length, pts = n * 20 * chain * chain; score += pts;
      popText(CX, CY - 180, '+' + pts, '#ffe14d', 22);
      if (chain >= 2) { banner(chain + ' 連鎖!', chain >= 4 ? '#ff6bd6' : '#ffe14d', 44 + chain * 4); shake(3 + chain * 2); }
    } else {
      phase = 'spawn';
      let ok = true; for (let i = 0; i < 3; i++) ok = dropNew() && ok;
      gravity();
      if (!ok) { over = true; flash(1); }
    }
  }
  if (phase === 'clear') {
    clearT += dt;
    if (clearT > 0.35) {
      for (const [r, cc] of clearing) { burst(bx(cc), by(r), TYPES[g[r][cc].t].c, 12); g[r][cc] = null; }
      clearing = []; gravity(); phase = 'fall';
    }
  }
  if (phase === 'spawn' && !falling()) phase = groups().length ? 'fall' : 'idle';
}

function draw() {
  ctx.save(); applyShake(ctx);
  bg(ctx, '#0f3b57', '#39b8a6');
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(angle); ctx.translate(-CX, -CY);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath();
  ctx.roundRect(CX - N * CS / 2 - 6, CY - N * CS / 2 - 6, N * CS + 12, N * CS + 12, 14); ctx.fill();
  for (let r = 0; r < N; r++) for (let cc = 0; cc < N; cc++) {
    const p = g[r][cc]; if (!p) continue;
    const isClr = phase === 'clear' && clearing.some(([y, x]) => y === r && x === cc);
    drawChar(ctx, bx(cc), by(r) + p.oy, 20, TYPES[p.t],
      { scale: isClr ? 1 + Math.sin(clearT * 40) * 0.15 : 1, glow: isClr ? '#fff' : null });
  }
  ctx.restore();
  // 重力方向の矢印
  outlineText(ctx, '⬇ 重力', CX, CY + N * CS / 2 + 24, 14, '#fff', 3);
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'くるりんボード', score, '手数 ' + turns);
  outlineText(ctx, 'スワイプ or ボタンで盤面を回転！', W / 2, 92, 14, '#fff', 3);
  // 回転ボタン
  for (const [x, t] of [[W / 4, '⟲'], [W * 3 / 4, '⟳']]) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(x, 596, 30, 0, 7); ctx.fill();
    outlineText(ctx, t, x, 596, 34, '#0f3b57', 0);
  }
  if (over) gameOverPanel(ctx, score, '最大 ' + maxChain + ' 連鎖 / タップでもう一度');
}
loop(update, draw);
</script></body></html>
