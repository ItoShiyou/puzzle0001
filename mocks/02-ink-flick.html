<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>インク・フリック</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 02 インク・フリック
// キャラを引っぱって弾くと、画用紙の上を転がりながらインクの軌跡を残す。
// 軌跡がぐるっと交差して「囲む」と中が一気に塗りつぶされる。6回弾いて、塗った割合がスコア。
// 毎回ちがう「作品」ができあがるので、完成画面がそのままシェア素材になる。
const { c, ctx } = setupCanvas();
const PAPER = { x: 16, y: 96, w: 328, h: 480 };
// キャラごとの塗りの個性（IPキャラのスキルに相当）
const SKILL = [
  { m: MASCOTS[0], w: 16, fric: 1.1, bounce: 0.8, name: 'ふつう' },
  { m: MASCOTS[1], w: 30, fric: 1.6, bounce: 0.6, name: 'ふとふで' },
  { m: MASCOTS[2], w: 12, fric: 0.6, bounce: 1.0, name: 'よくはねる' },
  { m: MASCOTS[3], w: 14, fric: 1.2, bounce: 0.8, name: '止まるとドバッ', splat: 58 },
];
const paint = document.createElement('canvas'); paint.width = W * 2; paint.height = H * 2;
const pctx = paint.getContext('2d'); pctx.scale(2, 2);
let stones, queue, ball, drag, path, shots, score, coverage, covT, over, idle, lastFill;

function reset() {
  pctx.clearRect(0, 0, W, H);
  stones = [...Array(4)].map(() => ({ x: rand(60, 300), y: rand(160, 440), r: rand(14, 24) }));
  queue = [...Array(6)].map(() => randi(4));
  shots = 6; score = 0; coverage = 0; covT = 0; over = false; ball = null; path = []; drag = null;
  spawn();
}
function spawn() {
  if (!queue.length) { over = true; finalScore(); return; }
  ball = { x: W / 2, y: PAPER.y + PAPER.h - 26, vx: 0, vy: 0, s: SKILL[queue.shift()], moving: false, rot: 0 };
  path = [];
}
function finalScore() {
  measure();
  score = Math.round(coverage * 100) * 100;
  banner('完成!', '#ff6f91', 60, '塗り ' + Math.round(coverage * 100) + '%');
  [0, 4, 7, 12, 16].forEach((k, i) => tone(392 * Math.pow(2, k / 12), 0.4, 'triangle', 0.08, i * 0.08));
}
reset();

c.addEventListener('pointerdown', e => {
  if (over) { reset(); return; }
  if (ball && !ball.moving) drag = { s: toLocal(c, e), p: toLocal(c, e) };
});
c.addEventListener('pointermove', e => { if (drag) drag.p = toLocal(c, e); });
c.addEventListener('pointerup', () => {
  if (!drag) return;
  const v = pull(); drag = null;
  if (Math.hypot(v.x, v.y) < 12) return;
  ball.vx = v.x * 7; ball.vy = v.y * 7; ball.moving = true; idle = 0; shots--;
  path = [{ x: ball.x, y: ball.y }];
  tone(330, 0.15, 'triangle', 0.1);
});
function pull() {
  let x = drag.s.x - drag.p.x, y = drag.s.y - drag.p.y, d = Math.hypot(x, y);
  if (d > 140) { x *= 140 / d; y *= 140 / d; }
  return { x, y };
}

function segX(a, b, c2, d) { // 線分交差点
  const r = { x: b.x - a.x, y: b.y - a.y }, s = { x: d.x - c2.x, y: d.y - c2.y };
  const den = r.x * s.y - r.y * s.x; if (Math.abs(den) < 1e-6) return null;
  const t = ((c2.x - a.x) * s.y - (c2.y - a.y) * s.x) / den, u = ((c2.x - a.x) * r.y - (c2.y - a.y) * r.x) / den;
  return t > 0 && t < 1 && u > 0 && u < 1 ? { x: a.x + r.x * t, y: a.y + r.y * t } : null;
}

function stroke(a, b) {
  pctx.strokeStyle = ball.s.m.c; pctx.lineWidth = ball.s.w; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
}

function addPoint(p) {
  const last = path[path.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 6) return;
  stroke(last, p);
  for (let i = 0; i < path.length - 6; i++) {
    const hit = segX(path[i], path[i + 1], last, p);
    if (!hit) continue;
    // ループ検出→中を塗りつぶし
    pctx.fillStyle = ball.s.m.c; pctx.beginPath(); pctx.moveTo(hit.x, hit.y);
    for (let k = i + 1; k < path.length; k++) pctx.lineTo(path[k].x, path[k].y);
    pctx.closePath(); pctx.fill();
    let cx = 0, cy = 0, n = 0; for (let k = i + 1; k < path.length; k++) { cx += path[k].x; cy += path[k].y; n++; }
    popText(cx / n, cy / n, 'ぐるっと塗り!', '#fff', 18); burst(cx / n, cy / n, ball.s.m.c, 24, 200, 0);
    shake(5); tone(660, 0.25, 'sine', 0.12); tone(990, 0.3, 'sine', 0.08, 0.06);
    path = [hit, p]; return;
  }
  path.push(p);
}

function measure() {
  const img = pctx.getImageData(PAPER.x * 2, PAPER.y * 2, PAPER.w * 2, PAPER.h * 2).data;
  let on = 0, tot = 0;
  for (let i = 3; i < img.length; i += 4 * 9) { tot++; if (img[i] > 0) on++; }
  coverage = on / tot;
}

function update(dt) {
  if (over || !ball) return;
  covT -= dt; if (covT < 0) { covT = 0.3; measure(); }
  if (!ball.moving) return;
  const s = ball.s, R = 16;
  for (let k = 0; k < 3; k++) {
    const h = dt / 3;
    ball.x += ball.vx * h; ball.y += ball.vy * h;
    const f = Math.exp(-s.fric * h); ball.vx *= f; ball.vy *= f;
    if (ball.x < PAPER.x + R) { ball.x = PAPER.x + R; ball.vx = Math.abs(ball.vx) * s.bounce; tone(200, 0.05, 'square', 0.04); }
    if (ball.x > PAPER.x + PAPER.w - R) { ball.x = PAPER.x + PAPER.w - R; ball.vx = -Math.abs(ball.vx) * s.bounce; tone(200, 0.05, 'square', 0.04); }
    if (ball.y < PAPER.y + R) { ball.y = PAPER.y + R; ball.vy = Math.abs(ball.vy) * s.bounce; tone(200, 0.05, 'square', 0.04); }
    if (ball.y > PAPER.y + PAPER.h - R) { ball.y = PAPER.y + PAPER.h - R; ball.vy = -Math.abs(ball.vy) * s.bounce; tone(200, 0.05, 'square', 0.04); }
    for (const st of stones) {
      const dx = ball.x - st.x, dy = ball.y - st.y, d = Math.hypot(dx, dy);
      if (d < st.r + R && d > 0) {
        const nx = dx / d, ny = dy / d, vn = ball.vx * nx + ball.vy * ny;
        ball.x = st.x + nx * (st.r + R); ball.y = st.y + ny * (st.r + R);
        if (vn < 0) { ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny; tone(420, 0.06, 'square', 0.05); }
      }
    }
    addPoint({ x: ball.x, y: ball.y });
  }
  ball.rot += Math.hypot(ball.vx, ball.vy) * dt * 0.02;
  if (Math.hypot(ball.vx, ball.vy) < 12) {
    if (s.splat) {
      pctx.fillStyle = s.m.c; pctx.beginPath();
      for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, rr = s.splat * rand(0.6, 1.1); i ? pctx.lineTo(ball.x + Math.cos(a) * rr, ball.y + Math.sin(a) * rr) : pctx.moveTo(ball.x + Math.cos(a) * rr, ball.y + Math.sin(a) * rr); }
      pctx.fill(); burst(ball.x, ball.y, s.m.c, 30, 260, 0); shake(6); tone(150, 0.3, 'sawtooth', 0.08);
      popText(ball.x, ball.y - 20, 'ドバッ!', '#fff', 20);
    }
    ball.moving = false; ball = null;
    setTimeout(spawn, 350);
  }
}

function draw() {
  ctx.save(); applyShake(ctx);
  ctx.fillStyle = '#e9dcc4'; ctx.fillRect(0, 0, W, H);
  // 画用紙
  ctx.fillStyle = '#fffdf6'; ctx.shadowColor = 'rgba(80,50,20,0.25)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  ctx.fillRect(PAPER.x, PAPER.y, PAPER.w, PAPER.h); ctx.shadowColor = 'transparent';
  ctx.save(); ctx.beginPath(); ctx.rect(PAPER.x, PAPER.y, PAPER.w, PAPER.h); ctx.clip();
  ctx.drawImage(paint, 0, 0, W, H);
  ctx.restore();
  for (const st of stones) {
    ctx.fillStyle = '#8d8173'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#a89c8d'; ctx.beginPath(); ctx.arc(st.x - st.r * 0.25, st.y - st.r * 0.25, st.r * 0.55, 0, 7); ctx.fill();
  }
  if (ball) {
    if (drag) {
      const v = pull();
      ctx.setLineDash([4, 8]); ctx.strokeStyle = rgba('#2b2140', 0.5); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + v.x * 2.2, ball.y + v.y * 2.2); ctx.stroke(); ctx.setLineDash([]);
    }
    drawMascot(ctx, ball.x, ball.y, 16, ball.s.m, { rot: ball.moving ? Math.sin(ball.rot) * 0.4 : 0, expr: ball.moving ? 'wow' : 'normal' });
    if (!ball.moving) outlineText(ctx, ball.s.name, ball.x, ball.y + 30, 11, '#fff', 3);
  }
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'インク・フリック', over ? score : Math.round(coverage * 100) + '%', '', '#fff');
  // 次のキャラ
  outlineText(ctx, 'NEXT', 180, 600, 11, '#6b5a45', 0, 'center');
  queue.forEach((q, i) => drawMascot(ctx, 150 - queue.length * 12 + i * 26 + 30, 620, 10, SKILL[q].m));
  outlineText(ctx, '残り ' + (shots) + ' 回', W - 14, 50, 17, '#fff', 4, 'right');
  if (over) {
    ctx.fillStyle = 'rgba(25,15,45,0.35)'; ctx.fillRect(0, 580, W, 60);
    outlineText(ctx, 'タップで新しい画用紙', W / 2, 610, 16, '#fff', 4);
  }
}
loop(update, draw);
</script></body></html>
