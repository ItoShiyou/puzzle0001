<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ひっぱりポップ</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 05: 引っぱって弾く→ビリヤードのように玉突き。同じキャラ同士が勢いよくぶつかるとハジけて衝撃波→さらに玉突き連鎖
const { c, ctx } = setupCanvas();
const TYPES = CHARS.slice(0, 4), BR = 18, L = 16, R = 344, T = 100, B = 610, COUNT = 22;
let rings = [], balls, shooter, drag, shots, score, chain, phase, still, over, time;

function freeSpot(yMin = T + BR, yMax = 480) {
  for (let k = 0; k < 200; k++) {
    const x = rand(L + BR, R - BR), y = rand(yMin, yMax);
    if (balls.every(b => Math.hypot(b.x - x, b.y - y) > BR * 2 + 4)) return { x, y };
  }
  return { x: rand(L + BR, R - BR), y: rand(yMin, yMax) };
}
function addBall(t = randi(4)) { const p = freeSpot(); balls.push({ ...p, vx: 0, vy: 0, t, s: 0 }); }
function newShooter() {
  shooter = { x: W / 2, y: 560, vx: 0, vy: 0, t: randi(4), s: 0, shooter: true };
  balls.push(shooter);
}
function reset() {
  balls = []; for (let i = 0; i < COUNT; i++) addBall(); balls.forEach(b => b.s = 1);
  shots = 10; score = 0; chain = 0; phase = 'aim'; still = 0; over = false; time = 0; drag = null;
  newShooter();
}
reset();

c.addEventListener('pointerdown', e => {
  if (over) { reset(); return; }
  if (phase === 'aim') drag = { s: toLocal(c, e), p: toLocal(c, e) };
});
c.addEventListener('pointermove', e => { if (drag) drag.p = toLocal(c, e); });
c.addEventListener('pointerup', () => {
  if (!drag) return;
  const v = pull(); drag = null;
  if (Math.hypot(v.x, v.y) < 15) return;
  shooter.vx = v.x * 8; shooter.vy = v.y * 8; shooter.moving = true;
  shots--; chain = 0; phase = 'roll'; still = 0;
});
function pull() {
  let x = drag.s.x - drag.p.x, y = drag.s.y - drag.p.y; const d = Math.hypot(x, y);
  if (d > 130) { x *= 130 / d; y *= 130 / d; }
  return { x, y };
}

function pop(b) {
  if (b.dead) return;
  b.dead = true; chain++;
  const pts = 50 * chain; score += pts;
  burst(b.x, b.y, TYPES[b.t].c, 16, 260); popText(b.x, b.y - 16, '+' + pts, '#ffe14d', 14 + Math.min(10, chain));
  shake(2 + Math.min(8, chain)); rings.push({ x: b.x, y: b.y, life: 0.3 });
  for (const o of balls) { // 衝撃波
    if (o.dead) continue;
    const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy);
    if (d < 80 && d > 0) { o.vx += dx / d * 260; o.vy += dy / d * 260; }
  }
  if ([3, 6, 10, 15].includes(chain)) banner(chain + ' CHAIN!', chain >= 10 ? '#ff6bd6' : '#ffe14d', 40 + chain);
}

function step(dt) {
  for (const b of balls) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    const f = Math.exp(-1.1 * dt); b.vx *= f; b.vy *= f;
    if (b.x < L + BR) { b.x = L + BR; b.vx = Math.abs(b.vx) * 0.9; }
    if (b.x > R - BR) { b.x = R - BR; b.vx = -Math.abs(b.vx) * 0.9; }
    if (b.y < T + BR) { b.y = T + BR; b.vy = Math.abs(b.vy) * 0.9; }
    if (b.y > B - BR) { b.y = B - BR; b.vy = -Math.abs(b.vy) * 0.9; }
  }
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j]; if (a.dead || b.dead) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    if (d >= BR * 2) continue;
    const nx = dx / d, ny = dy / d, ov = BR * 2 - d;
    a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2;
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rv < 0) {
      const imp = -rv * 0.95; a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny;
      if (a.t === b.t && -rv > 70 && phase === 'roll') { pop(a); pop(b); }
    }
  }
  balls = balls.filter(b => !b.dead);
}

function update(dt) {
  if (over) return;
  time += dt;
  for (let k = 0; k < 4; k++) step(dt / 4);
  for (const b of balls) if (b.s < 1) b.s = Math.min(1, b.s + dt * 4);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  if (phase === 'roll') {
    const moving = balls.some(b => Math.hypot(b.vx, b.vy) > 6);
    still = moving ? 0 : still + dt;
    if (still > 0.3) {
      for (const b of balls) { b.vx = b.vy = 0; delete b.shooter; }
      if (chain >= 2) popText(W / 2, 130, chain + ' CHAIN 達成', '#7fffd4', 20);
      let add = COUNT - balls.length; while (add-- > 0) addBall();
      if (shots <= 0) { over = true; return; }
      newShooter(); phase = 'aim';
    }
  }
}

function draw() {
  ctx.save(); applyShake(ctx);
  bg(ctx, '#0b3d2e', '#1f7a4d');
  ctx.fillStyle = '#12613f'; ctx.beginPath(); ctx.roundRect(L - 6, T - 6, R - L + 12, B - T + 12, 16); ctx.fill();
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 8; ctx.stroke();
  for (const b of balls) drawChar(ctx, b.x, b.y, BR, TYPES[b.t], { scale: b.s, glow: b.shooter ? '#fff' : null });
  if (drag && phase === 'aim') {
    const v = pull();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(shooter.x, shooter.y); ctx.lineTo(shooter.x + v.x * 2.5, shooter.y + v.y * 2.5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#ffe14d'; ctx.beginPath(); ctx.moveTo(shooter.x, shooter.y); ctx.lineTo(shooter.x - v.x * 0.5, shooter.y - v.y * 0.5); ctx.stroke();
  }
  for (const p of rings) {
    ctx.strokeStyle = `rgba(255,255,255,${p.life / 0.3})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 80 * (1 - p.life / 0.3) + 10, 0, 7); ctx.stroke();
  }
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'ひっぱりポップ', score, '残りショット ' + shots);
  if (phase === 'aim' && !over) outlineText(ctx, 'どこでも引っぱって離す！同じキャラ同士の衝突でハジける', W / 2, 628, 11, '#fff', 3);
  if (over) gameOverPanel(ctx, score);
}
loop(update, draw);
</script></body></html>
