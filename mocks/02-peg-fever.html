<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ペグ・フィーバー</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 02: 狙って撃つ→ボールがキャラペグの間を跳ね回る。同じ色のキャラは即はじけ、他は点灯して最後にまとめて消える
const { c, ctx } = setupCanvas();
const TYPES = CHARS.slice(0, 4), GOLD = { e: '⭐', c: '#ffd700' };
const LX = 12, RX = 348, BR = 9, PR = 13, GRAV = 620;
let pegs, ball, ballType, balls, score, stage, aim, combo, clearing, bucket, over, slowmo, shotT, fever;

function genBoard() {
  pegs = [];
  for (let row = 0; row < 9; row++) {
    const n = row % 2 ? 6 : 7;
    for (let i = 0; i < n; i++) {
      if (Math.random() < 0.12) continue;
      const x = 42 + i * 46 + (row % 2 ? 23 : 0) + rand(-4, 4), y = 180 + row * 44;
      pegs.push({ x, y, t: randi(4), gold: false, lit: false, pop: 0 });
    }
  }
  const idx = pegs.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 8);
  idx.forEach(i => pegs[i].gold = true);
}
function reset() {
  genBoard(); ball = null; ballType = randi(4); balls = 10; score = 0; stage = 1;
  aim = { x: W / 2, y: 300 }; combo = 1; clearing = []; bucket = { x: W / 2, dir: 1 }; over = false; slowmo = 0; fever = false;
}
reset();

c.addEventListener('pointerdown', e => { if (over) { reset(); return; } aim = toLocal(c, e); });
c.addEventListener('pointermove', e => { aim = toLocal(c, e); });
c.addEventListener('pointerup', e => {
  if (over || ball || clearing.length) return;
  aim = toLocal(c, e);
  const dx = aim.x - W / 2, dy = Math.max(20, aim.y - 90), d = Math.hypot(dx, dy);
  ball = { x: W / 2, y: 90, vx: dx / d * 480, vy: dy / d * 480, t: ballType };
  balls--; combo = 1; shotT = 0;
});

function endShot() {
  clearing = pegs.filter(p => p.lit && !p.pop);
  clearing.forEach((p, i) => p.delay = i * 0.07);
  ball = null; ballType = randi(4);
  if (!clearing.length) afterShot();
}

function update(dt) {
  if (over) return;
  if (slowmo > 0) { slowmo -= dt; dt *= 0.25; }
  bucket.x += bucket.dir * 90 * dt;
  if (bucket.x > RX - 40 || bucket.x < LX + 40) bucket.dir *= -1;
  for (const p of pegs) if (p.pop) p.pop += dt * 4;
  pegs = pegs.filter(p => p.pop < 1);
  if (ball) {
    shotT += dt;
    for (let k = 0; k < 4; k++) {
      const h = dt / 4;
      ball.vy += GRAV * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < LX + BR) { ball.x = LX + BR; ball.vx = Math.abs(ball.vx); }
      if (ball.x > RX - BR) { ball.x = RX - BR; ball.vx = -Math.abs(ball.vx); }
      for (const p of pegs) {
        if (p.pop) continue;
        const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
        if (d > BR + PR || d === 0) continue;
        const nx = dx / d, ny = dy / d, vn = ball.vx * nx + ball.vy * ny;
        ball.x = p.x + nx * (BR + PR); ball.y = p.y + ny * (BR + PR);
        if (vn < 0) { ball.vx -= 1.75 * vn * nx; ball.vy -= 1.75 * vn * ny; }
        hitPeg(p);
      }
    }
    // 近くの残りゴールドが1つだけならスローモーション（動画映え用）
    const golds = pegs.filter(p => p.gold && !p.pop);
    if (golds.length === 1 && Math.hypot(golds[0].x - ball.x, golds[0].y - ball.y) < 70 && slowmo <= 0) slowmo = 0.4;
    if (ball.y > 600 && ball.y - ball.vy * dt <= 600 && Math.abs(ball.x - bucket.x) < 36) {
      balls++; banner('FREE BALL!', '#7fffd4', 40); burst(ball.x, 600, '#7fffd4', 20);
    }
    if (ball.y > H + 20 || shotT > 12) endShot();
  }
  if (clearing.length) {
    for (const p of clearing) {
      p.delay -= dt;
      if (p.delay <= 0 && !p.pop) popPeg(p, 30);
    }
    clearing = clearing.filter(p => !p.pop);
    if (!clearing.length) afterShot();
  } else if (!ball && balls <= 0 && !over) over = true;
}

function hitPeg(p) {
  if (p.gold) { popPeg(p, 500); shake(5); if (!pegs.some(q => q.gold && !q.pop)) feverClear(); return; }
  if (p.t === ball.t) { popPeg(p, 100 * combo); combo++; if (combo % 5 === 0) banner(combo + ' CHAIN!'); return; }
  if (!p.lit) { p.lit = true; score += 10; }
}
function popPeg(p, pts) {
  p.pop = 0.01; score += pts;
  burst(p.x, p.y, p.gold ? '#ffd700' : TYPES[p.t].c, p.gold ? 24 : 10);
  popText(p.x, p.y - 14, '+' + pts, p.gold ? '#ffd700' : '#fff', p.gold ? 20 : 14);
}
function feverClear() {
  fever = true; banner('FEVER!!', '#ff6bd6', 64); flash(1); shake(12);
  for (const p of pegs) if (!p.pop) popPeg(p, 200);
}
function afterShot() {
  if (fever) { fever = false; stage++; balls += 3; genBoard(); banner('STAGE ' + stage, '#7fffd4', 44); }
}

function draw() {
  ctx.save(); applyShake(ctx);
  bg(ctx, '#1b1450', '#4a2b7a');
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(LX, 70, RX - LX, H - 70);
  // 照準ガイド
  if (!ball && !clearing.length && !over) {
    const dx = aim.x - W / 2, dy = Math.max(20, aim.y - 90), d = Math.hypot(dx, dy);
    let x = W / 2, y = 90, vx = dx / d * 480, vy = dy / d * 480;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 26; i++) {
      for (let k = 0; k < 3; k++) { vy += GRAV * 0.01; x += vx * 0.01; y += vy * 0.01; if (x < LX + BR || x > RX - BR) vx *= -1; }
      ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
    }
  }
  for (const p of pegs) {
    const s = p.pop ? 1 + p.pop * 0.8 : 1, a = p.pop ? 1 - p.pop : 1;
    drawChar(ctx, p.x, p.y, PR, p.gold ? GOLD : TYPES[p.t], { scale: s, alpha: a, glow: p.lit ? '#fff' : null });
  }
  // 発射台
  drawChar(ctx, W / 2, 90, 20, TYPES[ballType], { alpha: ball ? 0.3 : 1 });
  if (ball) drawChar(ctx, ball.x, ball.y, BR + 2, TYPES[ball.t], { glow: '#fff' });
  // バケツ
  ctx.fillStyle = '#7fffd4'; ctx.beginPath(); ctx.roundRect(bucket.x - 36, 600, 72, 14, 7); ctx.fill();
  outlineText(ctx, 'FREE', bucket.x, 607, 10, '#1b1450', 0);
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'ペグ・フィーバー  STAGE ' + stage, score, '残り ●×' + balls);
  outlineText(ctx, '同じキャラは即ハジける！ ⭐を全部消すとFEVER', W / 2, 140, 12, '#fff', 3);
  if (over) gameOverPanel(ctx, score);
}
loop(update, draw);
</script></body></html>
