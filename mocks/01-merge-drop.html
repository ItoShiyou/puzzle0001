<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>もちもち合体ドロップ</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 01: 物理演算で落とす→同じキャラ同士がくっつくと「進化」して大きくなる
const { c, ctx } = setupCanvas();
const LV = [ // 進化ライン（IPキャラの成長段階に差し替え）
  ['🐭', '#d9d0ff', 14], ['🐹', '#ffd3a6', 18], ['🐰', '#ffc2d9', 23], ['🐱', '#ff8fb1', 28], ['🐶', '#ffc36b', 34],
  ['🦊', '#ff9a52', 41], ['🐼', '#e6e6e6', 49], ['🐻', '#c98b5a', 58], ['🦁', '#ffd24d', 68], ['🐲', '#6fe08a', 80],
].map(([e, c, r]) => ({ e, c, r }));
const L = 20, R = 340, FLOOR = 610, LINE = 130;
let balls, score, cur, next, dropX, cooldown, over, combo, lastMerge, dangerT, time;

function reset() {
  balls = []; score = 0; cur = randi(4); next = randi(4); dropX = W / 2; cooldown = 0;
  over = false; combo = 0; lastMerge = -9; dangerT = 0; time = 0;
}
reset();

c.addEventListener('pointermove', e => { dropX = toLocal(c, e).x; });
c.addEventListener('pointerdown', e => { if (over) { reset(); return; } dropX = toLocal(c, e).x; });
c.addEventListener('pointerup', () => {
  if (over || cooldown > 0) return;
  const r = LV[cur].r;
  balls.push({ x: Math.max(L + r, Math.min(R - r, dropX)), y: 90, vx: 0, vy: 0, lv: cur, born: time });
  cur = next; next = randi(5); cooldown = 0.5;
});

function merge(a, b) {
  a.dead = b.dead = true;
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  combo = time - lastMerge < 1.2 ? combo + 1 : 1; lastMerge = time;
  const pts = (a.lv + 1) * 10 * combo; score += pts;
  burst(x, y, LV[a.lv].c, 10 + a.lv * 3);
  popText(x, y - 10, '+' + pts, '#ffe14d', 16 + a.lv);
  if (a.lv + 1 < LV.length) {
    balls.push({ x, y, vx: (a.vx + b.vx) / 2, vy: -60, lv: a.lv + 1, born: time, grow: 0 });
    if (a.lv + 1 >= 6) { banner(LV[a.lv + 1].e + ' 進化！', '#7fffd4', 42); shake(6); flash(0.4); }
  } else { banner('伝説キャラ誕生!!', '#ff6bd6', 36); shake(12); flash(1); score += 5000; }
  if (combo >= 3) { banner(combo + ' COMBO!', '#ffe14d'); shake(4); }
}

function step(dt) {
  for (const b of balls) {
    const r = LV[b.lv].r;
    b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.995;
    if (b.x - r < L) { b.x = L + r; b.vx *= -0.3; }
    if (b.x + r > R) { b.x = R - r; b.vx *= -0.3; }
    if (b.y + r > FLOOR) { b.y = FLOOR - r; b.vy *= -0.2; b.vx *= 0.9; }
  }
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j];
    if (a.dead || b.dead) continue;
    const ra = LV[a.lv].r, rb = LV[b.lv].r;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    if (d >= ra + rb) continue;
    if (a.lv === b.lv) { merge(a, b); continue; }
    const nx = dx / d, ny = dy / d, ov = ra + rb - d;
    const ma = ra * ra, mb = rb * rb, s = ma + mb;
    a.x -= nx * ov * mb / s; a.y -= ny * ov * mb / s;
    b.x += nx * ov * ma / s; b.y += ny * ov * ma / s;
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rv < 0) {
      const imp = -(1.1) * rv / (1 / ma + 1 / mb);
      a.vx -= imp * nx / ma; a.vy -= imp * ny / ma; b.vx += imp * nx / mb; b.vy += imp * ny / mb;
    }
  }
  balls = balls.filter(b => !b.dead);
}

function update(dt) {
  if (over) return;
  time += dt; cooldown -= dt;
  for (let k = 0; k < 4; k++) step(dt / 4);
  for (const b of balls) if (b.grow != null && b.grow < 1) b.grow = Math.min(1, b.grow + dt * 6);
  const danger = balls.some(b => time - b.born > 1.5 && b.y - LV[b.lv].r < LINE);
  dangerT = danger ? dangerT + dt : 0;
  if (dangerT > 2) { over = true; flash(1); }
}

function draw() {
  ctx.save(); applyShake(ctx);
  bg(ctx, '#ffe8f3', '#ffd0a8');
  // 箱
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(L, LINE, R - L, FLOOR - LINE);
  ctx.strokeStyle = '#b86b8c'; ctx.lineWidth = 4; ctx.strokeRect(L, LINE - 40, R - L, FLOOR - LINE + 40);
  ctx.setLineDash([8, 6]); ctx.strokeStyle = dangerT > 0 && Math.sin(time * 20) > 0 ? '#ff2d55' : 'rgba(184,107,140,.5)';
  ctx.beginPath(); ctx.moveTo(L, LINE); ctx.lineTo(R, LINE); ctx.stroke(); ctx.setLineDash([]);
  // ガイド＆手持ち
  if (!over) {
    const r = LV[cur].r, x = Math.max(L + r, Math.min(R - r, dropX));
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 90); ctx.lineTo(x, FLOOR); ctx.stroke();
    drawChar(ctx, x, 90, r, LV[cur], { alpha: cooldown > 0 ? 0.4 : 1 });
  }
  for (const b of balls) drawChar(ctx, b.x, b.y, LV[b.lv].r, LV[b.lv], { scale: b.grow != null ? 0.6 + 0.4 * b.grow : 1 });
  drawFX(ctx);
  ctx.restore();
  hud(ctx, 'もちもち合体ドロップ', score, '');
  outlineTextR(ctx, 'NEXT', W - 56, 45, 14, '#fff'); drawChar(ctx, W - 28, 45, 15, LV[next]);
  // 進化表
  LV.forEach((l, i) => drawChar(ctx, 22 + i * 35, 625, 11, l, { alpha: 0.9 }));
  if (over) gameOverPanel(ctx, score);
}
loop(update, draw);
</script></body></html>
