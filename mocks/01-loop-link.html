<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>わっかつなぎ</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="c"></canvas><a class="back" href="../index.html">一覧へ</a></div>
<script src="common.js"></script>
<script>
// 01 わっかつなぎ
// 同じキャラを縦横ななめになぞって3つ以上で消す（基本はなぞり消し）。
// 独自ルール：なぞった線を「始点に戻して閉じる」と“わっか”になり、内側のキャラも色に関係なく全部消える。
// → どこで輪を作るかを盤面から探すパズル。7個以上でボム。
const board = new Board({ cols: 7, rows: 8, cell: 46, x0: 19, y0: 140 });
let path = null, loopClosed = false;

function inPoly(x, y, pts) {
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) ins = !ins;
  }
  return ins;
}
const adj = (a, b) => Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c)) === 1;
const same = (a, b) => a.r === b.r && a.c === b.c;

function hitCell(p) {
  const cl = board.cellAt(p.x, p.y); if (!cl) return null;
  const q = board.pos(cl.r, cl.c);
  return Math.hypot(p.x - q.x, p.y - q.y) < board.cell * 0.46 ? cl : null;
}
function unselect() { for (const q of board.all()) q.p.sel = false; }

Game.init({
  id: 'loop', title: 'わっかつなぎ', board, bg: ['#bfe6ff', '#ffe3f1'],
  howto: '同じキャラを<b>なぞって3つ以上</b>で消える。<br>なぞった線を<b>スタート地点に戻して閉じる</b>と「わっか」！内側のキャラも<b>色に関係なく全部</b>消える。7個以上消すとボム。',
  onStart() { path = null; },
  onDown(p) {
    if (board.busy()) return;
    const cl = hitCell(p); if (!cl) return;
    const pc = board.get(cl.r, cl.c); if (!pc || pc.sp) return;
    path = [cl]; loopClosed = false; pc.sel = true; tone(noteHz(3), 0.06, 'sine', 0.05);
  },
  onMove(p) {
    if (!path || loopClosed) return;
    const cl = hitCell(p); if (!cl) return;
    const last = path[path.length - 1], t = board.get(path[0].r, path[0].c).t;
    if (same(cl, last)) return;
    if (path.length >= 2 && same(cl, path[path.length - 2])) { board.get(last.r, last.c).sel = false; path.pop(); return; }
    if (path.length >= 4 && same(cl, path[0]) && adj(cl, last)) { loopClosed = true; tone(noteHz(10), 0.2, 'triangle', 0.08); return; }
    const pc = board.get(cl.r, cl.c);
    if (!pc || pc.sp || pc.t !== t || !adj(cl, last) || path.some(q => same(q, cl))) return;
    path.push(cl); pc.sel = true; tone(noteHz(3 + path.length), 0.06, 'sine', 0.05);
  },
  onUp() {
    if (!path) return;
    const pth = path; path = null; unselect();
    if (pth.length < 3) return;
    let cells = pth.slice(), inner = 0;
    if (loopClosed) {
      const poly = pth.map(q => board.pos(q.r, q.c));
      for (const q of board.all()) if (!pth.some(z => same(z, q)) && inPoly(board.pos(q.r, q.c).x, board.pos(q.r, q.c).y, poly)) { cells.push(q); inner++; }
    }
    const last = pth[pth.length - 1], { x, y } = board.pos(last.r, last.c);
    const n = board.remove(cells);
    Game.scoreClear(n, x, y, loopClosed ? 1.5 : 1, loopClosed ? 'わっか!' : '');
    if (loopClosed) { banner(inner ? 'わっか!' : 'わっか', '#ff6f91', 48, inner ? '内側 ' + inner + '個もまとめて' : ''); shake(5); }
    Game.maybeBomb(n, last.r, last.c);
    board.collapse();
  },
  drawExtra(ctx) {
    if (!path || path.length < 1) return;
    const pts = path.map(q => board.pos(q.r, q.c)), col = MASCOTS[board.get(path[0].r, path[0].c).t].c;
    if (loopClosed) { ctx.fillStyle = rgba(col, 0.3); ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.fill(); }
    for (const [w, s] of [[14, '#fff'], [8, col]]) {
      ctx.strokeStyle = s; ctx.lineWidth = w; ctx.lineCap = ctx.lineJoin = 'round';
      ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); if (loopClosed) ctx.closePath(); ctx.stroke();
    }
    outlineText(ctx, path.length + (loopClosed ? ' わっか!' : ''), pts[pts.length - 1].x, pts[pts.length - 1].y - 30, 18, '#fff', 4);
  },
});
</script></body></html>
